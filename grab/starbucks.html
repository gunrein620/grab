<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starbucks Menu Highlight</title>
  <style>
    :root {
      --blue: #2b6df6;
      --blue-dark: #12306b;
      --blue-soft: #dfeaff;
      --panel: rgba(246, 249, 255, 0.86);
      --text: #142033;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Apple SD Gothic Neo", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.35), transparent 35%),
        linear-gradient(135deg, var(--blue-dark), var(--blue));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 1080px;
      background: rgba(227, 238, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 28px;
      padding: 36px;
      backdrop-filter: blur(10px);
      box-shadow: 0 24px 60px rgba(10, 24, 61, 0.3);
    }

    .hero {
      display: grid;
      gap: 36px;
      grid-template-columns: minmax(0, 1.15fr) minmax(320px, 420px);
      align-items: start;
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      color: #fefefe;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 12px;
      color: #ffffff;
      font-size: clamp(34px, 5vw, 54px);
      line-height: 1.05;
    }

    .intro {
      margin: 0;
      color: rgba(255, 255, 255, 0.86);
      max-width: 520px;
      font-size: 18px;
      line-height: 1.8;
    }

    .visual {
      position: relative;
      min-height: 520px;
      border-radius: 28px;
      background: transparent;
      overflow: hidden;
      padding-top: 10px;
    }

    .drink-panel {
      position: absolute;
      right: 0;
      top: 10px;
      z-index: 2;
      width: min(340px, 100%);
      padding: 22px;
      border-radius: 24px;
      background: var(--panel);
      backdrop-filter: blur(6px);
      box-shadow: 0 18px 36px rgba(17, 43, 102, 0.18);
    }

    .drink-photo {
      width: 100%;
      height: 280px;
      margin-bottom: 18px;
      border-radius: 22px;
      background: var(--blue-soft);
      display: block;
      object-fit: contain;
      object-position: center;
      padding: 18px;
    }

    .drink-label {
      margin: 0 0 6px;
      color: #3d5d9b;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .drink-name {
      margin: 0 0 18px;
      font-size: 30px;
      font-weight: 800;
      line-height: 1.18;
      color: #17305f;
    }

    .drink-button {
      border: 0;
      border-radius: 999px;
      padding: 15px 18px;
      width: 100%;
      background: var(--blue);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .drink-button:hover {
      transform: translateY(-1px);
      background: #215ce0;
    }

    .drink-button:active {
      transform: translateY(0);
    }

    @media (max-width: 760px) {
      .page {
        padding: 24px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .visual {
        min-height: 480px;
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
      }

      .drink-panel {
        position: relative;
        right: auto;
        top: auto;
        width: 100%;
        max-width: 380px;
        margin: 8px 0 0 auto;
      }

      .drink-photo {
        height: 260px;
      }

      .drink-name {
        font-size: 26px;
      }
    }
  </style>
</head>

          시즌 음료부터 시그니처 커피까지, 그날의 기분에 어울리는 한 잔을 가볍게 골라보세요.
        </p>
      </div>

      <div class="visual">
        <section class="drink-panel" aria-live="polite">

          <button class="drink-button" id="today-drink-button" type="button">오늘의 음료</button>
