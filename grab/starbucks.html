<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starbucks Menu Highlight</title>
  <style>
    :root {
      --green: #006241;
      --green-dark: #0b3b2e;
      --cream: #f6f1e7;
      --text: #1f2933;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Apple SD Gothic Neo", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.35), transparent 35%),
        linear-gradient(135deg, var(--green-dark), var(--green));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .page {
      width: 100%;
      max-width: 980px;
      background: rgba(246, 241, 231, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 32px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(7, 30, 24, 0.32);
    }

    .hero {
      display: grid;
      gap: 24px;
      grid-template-columns: 1.2fr 1fr;
      align-items: start;
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      color: #fefefe;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 12px;
      color: #ffffff;
      font-size: clamp(34px, 5vw, 54px);
      line-height: 1.05;
    }

    .intro {
      margin: 0;
      color: rgba(255, 255, 255, 0.86);
      font-size: 17px;
      line-height: 1.7;
    }

    .visual {
      position: relative;
      min-height: 380px;
      border-radius: 24px;
      background: transparent;
      overflow: hidden;
      padding-top: 8px;
    }

    .drink-panel {
      position: absolute;
      right: 18px;
      top: 8px;
      z-index: 2;
      width: min(220px, calc(100% - 36px));
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(6px);
      box-shadow: 0 12px 24px rgba(53, 42, 26, 0.16);
    }

    .drink-photo {
      width: 100%;
      height: 190px;
      margin-bottom: 14px;
      border-radius: 16px;
      background: #f3efe7;
      display: block;
      object-fit: contain;
      object-position: center;
      padding: 10px;
    }

    .drink-label {
      margin: 0 0 6px;
      color: #355847;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .drink-name {
      margin: 0 0 12px;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.2;
      color: #153a2d;
    }

    .drink-button {
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      width: 100%;
      background: var(--green);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .drink-button:hover {
      transform: translateY(-1px);
      background: #0a7b53;
    }

    .drink-button:active {
      transform: translateY(0);
    }

    @media (max-width: 760px) {
      .page {
        padding: 22px;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .visual {
        min-height: 340px;
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
      }

      .drink-panel {
        position: relative;
        right: auto;
        top: auto;
        margin: 8px 0 0 auto;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div>
        <span class="eyebrow">Season Favorite</span>
        <h1>Today&apos;s<br>Starbucks Drink</h1>
        <p class="intro">
          오늘의 음료 버튼을 누르면 스타벅스의 다양한 메뉴를 한 잔씩 만나볼 수 있습니다.
          시즌 음료부터 시그니처 커피까지, 그날의 기분에 어울리는 한 잔을 가볍게 골라보세요.
        </p>
      </div>

      <div class="visual">
        <section class="drink-panel" aria-live="polite">
          <img class="drink-photo" id="today-drink-image" alt="오늘의 음료 이미지">
          <p class="drink-label">Today Drink</p>
          <p class="drink-name" id="today-drink">스타벅스 에어로카노</p>
          <button class="drink-button" id="today-drink-button" type="button">오늘의 음료</button>
        </section>
      </div>
    </section>
  </main>
  <script>
    const drinks = [
      {
        name: "카페 아메리카노",
        image: "https://www.istarbucks.co.kr/upload/store/skuimg/2021/04/[94]_20210430103337006.jpg"
      },
      {
        name: "카페 라떼",
        image: "https://www.istarbucks.co.kr/upload/store/skuimg/2021/04/[41]_20210415133833725.jpg"
      },
      {
        name: "카라멜 마키아또",
        image: "https://www.istarbucks.co.kr/upload/store/skuimg/2021/04/[126197]_20210415154609863.jpg"
      },
      {
        name: "콜드 브루",
        image: "https://www.istarbucks.co.kr/upload/store/skuimg/2025/06/[9200000000038]_20250626095744182.jpg"
      },
      {
        name: "카푸치노",
        image: "https://www.istarbucks.co.kr/upload/store/skuimg/2021/04/[38]_20210415154821846.jpg"
      },
      {
        name: "플랫 화이트",
        image: "https://www.istarbucks.co.kr/upload/store/skuimg/2024/03/[9200000005178]_20240326103727795.jpg"
      },
      {
        name: "에스프레소 마키아또",
        image: "https://www.istarbucks.co.kr/upload/store/skuimg/2021/04/[25]_20210415144211211.jpg"
      },
      {
        name: "바닐라 스타벅스 더블 샷",
        image: "https://www.istarbucks.co.kr/upload/store/skuimg/2025/06/[110612]_20250626095701777.jpg"
      },
      {
        name: "바닐라 크림 콜드 브루",
        image: "https://www.istarbucks.co.kr/upload/store/skuimg/2025/06/[9200000000487]_20250626095703208.jpg"
      },
      {
        name: "나이트로 바닐라 크림",
        image: "https://www.istarbucks.co.kr/upload/store/skuimg/2025/06/[9200000002487]_20250626171201110.jpg"
      }
    ];

    const drinkName = document.getElementById("today-drink");
    const drinkImage = document.getElementById("today-drink-image");
    const drinkButton = document.getElementById("today-drink-button");
    let currentIndex = 0;

    function renderDrink(index) {
      drinkName.textContent = drinks[index].name;
      drinkImage.src = drinks[index].image;
      drinkImage.alt = `${drinks[index].name} 이미지`;
    }

    renderDrink(currentIndex);

    drinkButton.addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % drinks.length;
      renderDrink(currentIndex);
    });
  </script>
</body>
</html>
