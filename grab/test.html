<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>자기소개 페이지</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #eaf1ff 0%, var(--bg) 60%);
      color: var(--text);
      padding: 24px;
    }

    .card {
      width: min(560px, 100%);
      background: var(--card);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.08);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      color: var(--accent);
      background: #dbeafe;
      border-radius: 999px;
      padding: 6px 10px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      line-height: 1.6;
      color: var(--muted);
    }

    .info {
      margin-top: 20px;
      display: grid;
      gap: 10px;
    }

    .item {
      display: flex;
      gap: 10px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 12px;
    }

    .label {
      min-width: 68px;
      font-weight: 700;
      color: #374151;
    }

    .actions {
      margin-top: 22px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    #helloBtn {
      background: var(--accent);
      color: #fff;
    }

    #themeBtn {
      background: #111827;
      color: #fff;
    }

    #msg {
      margin-top: 14px;
      font-size: 14px;
      color: #374151;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <section class="card">
    <span class="badge">ABOUT ME</span>
    <h1>안녕하세요, 박군우입니다 👋</h1>
    <p>
      새로운 기술을 빠르게 익히고, 작은 개선을 꾸준히 쌓아 사용자 경험을 좋게 만드는 개발자입니다.
    </p>

    <div class="info">
      <div class="item"><span class="label">관심사</span><span>웹 프론트엔드, UI/UX, 생산성 도구</span></div>
      <div class="item"><span class="label">기술스택</span><span>HTML, CSS, JavaScript, React</span></div>
      <div class="item"><span class="label">목표</span><span>매일 1%씩 성장하는 개발자 되기</span></div>
    </div>

    <div class="actions">
      <button id="helloBtn" type="button">인사하기</button>
      <button id="themeBtn" type="button">배경 바꾸기</button>
    </div>
    <div id="msg"></div>
  </section>

  <script>
    const helloBtn = document.getElementById("helloBtn");
    const themeBtn = document.getElementById("themeBtn");
    const msg = document.getElementById("msg");
    const body = document.body;

    helloBtn.addEventListener("click", () => {
      const now = new Date();
      msg.textContent = `반갑습니다! 오늘도 좋은 하루 보내세요 :) (${now.toLocaleTimeString("ko-KR")})`;
    });

    let dark = false;
    themeBtn.addEventListener("click", () => {
      dark = !dark;
      if (dark) {
        body.style.background = "linear-gradient(135deg, #0f172a 0%, #111827 60%)";
        body.style.color = "#e5e7eb";
      } else {
        body.style.background = "linear-gradient(135deg, #eaf1ff 0%, #f4f7fb 60%)";
        body.style.color = "#1f2937";
      }
    });
  </script>
</body>
</html>
