<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grab 미니프로젝트</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --sub: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #020617 0%, #0f172a 60%, #111827 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 28px;
      backdrop-filter: blur(4px);
      box-shadow: 0 16px 30px rgba(2, 6, 23, 0.45);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    p {
      margin: 0;
      color: var(--sub);
      line-height: 1.6;
    }

    .links {
      margin-top: 20px;
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    }

    a {
      text-decoration: none;
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 10px;
      color: var(--text);
      padding: 12px 14px;
      transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
      text-align: center;
      font-weight: 600;
    }

    a:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: #0b223a;
      color: #f8fafc;
    }

    .note {
      margin-top: 18px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>팀 미니프로젝트 모음</h1>
    <p>
      팀원들과 함께 간단하게 만든 HTML 미니프로젝트 페이지입니다.<br>
      아래 링크를 눌러 각 프로젝트 화면으로 이동해보세요.
    </p>

    <section class="links">
      <a href="./sein.html">sein.html</a>
      <a href="./foodcup.html">foodcup.html</a>
      <a href="./tetris.html">tetris.html</a>
      <a href="./board.html">board.html</a>
      <a href="./kr-test.html">kr-test.html</a>
      <a href="./test.html">test.html</a>
    </section>

    <p class="note">Grab Project - Mini Project Landing Page</p>
  </main>
</body>
</html>
